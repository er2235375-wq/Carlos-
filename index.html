<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti con todo mi corazón</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --primary-color: #ff477e;
            --secondary-color: #ff70a6;
            --accent-color: #ff9770;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo de Estrellas */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Contenedor Principal / Tarjeta de Cristal */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1.5s ease-out forwards;
        }

        .heart-icon-header {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: heartbeat 1.5s infinite;
        }

        .title {
            font-family: 'Sacramento', cursive;
            font-size: 3.2rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
            text-shadow: 0 2px 10px rgba(255, 112, 166, 0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 25px;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            font-size: 0.9rem;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.6);
        }

        .btn-action:active {
            transform: translateY(1px);
        }

        /* Contenedor de Corazones Flotantes */
        .floating-hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: floatUp var(--speed) linear infinite;
            transition: transform 0.3s ease;
        }

        .floating-heart:hover {
            transform: scale(1.3) rotate(5deg);
            z-index: 100;
        }

        .heart-shape {
            font-size: var(--size);
            filter: drop-shadow(0 0 8px rgba(255, 71, 126, 0.6));
        }

        .heart-preview-text {
            font-size: 0.7rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0.8;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Animaciones */
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-15vh) translateX(var(--wind)) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal Estilizado */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(30, 25, 50, 0.9);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .close-modal:hover {
            opacity: 1;
        }

        .modal-heart {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: heartbeat 1.2s infinite;
        }

        .modal-message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ffedf2;
        }
    </style>
</head>
<body>
    <!-- Fondo de estrellas animadas -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Contenedor principal -->
    <main class="main-wrapper">
        <div class="glass-card">
            <div class="heart-icon-header">💖</div>
            <h1 class="title">Un universo de amor para ti</h1>
            <p class="subtitle">Cada corazón flotante guarda una pequeña razón de lo mucho que significas para mí. Haz clic en ellos para descubrirlas.</p>
            
            <div class="counter-box">
                <span>Corazones descubiertos: </span>
                <span id="counter">0</span> / <span id="totalHearts">0</span>
            </div>

            <button class="btn-action" id="spawnBtn">Hacer latir más la magia</button>
        </div>
    </main>

    <!-- Contenedor de corazones flotantes -->
    <div class="floating-hearts-container" id="heartsContainer"></div>

    <!-- Modal para ver la frase completa -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <button class="close-modal" id="closeModal">&times;</button>
            <div class="modal-heart">❤️</div>
            <p class="modal-message" id="modalMessage">Aquí irá tu frase especial...</p>
        </div>
    </div>

    <script>
        // Banco de frases románticas y especiales inscritas en los corazones
        const frasesAmor = [
            "Eres mi casualidad más bonita.",
            "Cada latido mío lleva tu nombre.",
            "Tu sonrisa ilumina incluso mis días más grises.",
            "Contigo el tiempo se detiene por completo.",
            "Me encantas de todas las formas posibles.",
            "Eres mi lugar seguro en este mundo.",
            "No sabía lo que era extrañar hasta que te conocí.",
            "Tus ojos son mi galaxia favorita.",
            "Haces que mi corazón sonría sin darme cuenta.",
            "Prefiero un minuto contigo a una eternidad sin ti.",
            "Gracias por aparecer y cambiarlo todo.",
            "Eres el sueño del que nunca quiero despertar.",
            "Tu risa es la melodía que alegra mis días.",
            "Simplemente perfecta para mi vida.",
            "Te amo hoy, mañana y siempre."
        ];

        let discoveredCount = 0;
        const totalHeartsElement = document.getElementById('totalHearts');
        const counterElement = document.getElementById('counter');
        const heartsContainer = document.getElementById('heartsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalMessage = document.getElementById('modalMessage');
        const closeModal = document.getElementById('closeModal');
        const spawnBtn = document.getElementById('spawnBtn');
        const starsContainer = document.getElementById('starsContainer');

        // Inicializar contador total
        totalHeartsElement.textContent = frasesAmor.length;

        // Generar fondo de estrellas estáticas animadas
        function createStars() {
            const starCount = 60;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                
                const size = Math.random() * 3 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                const duration = Math.random() * 3 + 2;
                star.style.setProperty('--duration', `${duration}s`);
                
                starsContainer.appendChild(star);
            }
        }

        // Crear un elemento de corazón flotante con su respectiva frase
        function createFloatingHeart(phrase, index) {
            const heartWrapper = document.createElement('div');
            heartWrapper.classList.add('floating-heart');

            // Posición horizontal aleatoria
            const randomLeft = Math.random() * 90 + 5; // Entre 5% y 95%
            heartWrapper.style.left = `${randomLeft}vw`;

            // Velocidad de subida aleatoria (entre 8s y 15s)
            const speed = Math.random() * 7 + 8;
            heartWrapper.style.setProperty('--speed', `${speed}s`);

            // Desplazamiento lateral por el viento simulado (-50px a 50px)
            const wind = `${(Math.random() - 0.5) * 100}px`;
            heartWrapper.style.setProperty('--wind', wind);

            // Tamaño aleatorio del corazón
            const size = Math.random() * 1.5 + 1.2; // Rem
            heartWrapper.style.setProperty('--size', `${size}rem`);

            // Estructura interna del corazón flotante
            const heartShape = document.createElement('div');
            heartShape.classList.add('heart-shape');
            heartShape.innerHTML = '❤️';

            const previewText = document.createElement('div');
            previewText.classList.add('heart-preview-text');
            previewText.textContent = phrase;

            heartWrapper.appendChild(heartShape);
            heartWrapper.appendChild(previewText);

            // Evento al hacer clic en el corazón
            let isDiscovered = false;
            heartWrapper.addEventListener('click', () => {
                showModal(phrase);
                if (!isDiscovered) {
                    isDiscovered = true;
                    discoveredCount++;
                    counterElement.textContent = discoveredCount;
                    previewText.style.background = 'rgba(255, 71, 126, 0.8)';
                    
                    // Comprobar si se descubrieron todos
                    if (discoveredCount === frasesAmor.length) {
                        setTimeout(() => {
                            alert("¡Felicidades! Has descubierto todas las razones de mi amor por ti.");
                        }, 500);
                    }
                }
            });

            // Eliminar el corazón cuando termine su animación para evitar acumulación en memoria
            heartWrapper.addEventListener('animationend', () => {
                heartWrapper.remove();
                createFloatingHeart(phrase, index);
            });

            heartsContainer.appendChild(heartWrapper);
        }

        // Mostrar Modal con la frase
        function showModal(text) {
            modalMessage.textContent = text;
            modalOverlay.classList.add('active');
        }

        // Cerrar Modal
        function closeTheModal() {
            modalOverlay.classList.remove('active');
        }

        closeModal.addEventListener('click', closeTheModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeTheModal();
            }
        });

        // Botón dinámico para intensificar la lluvia de corazones
        spawnBtn.addEventListener('click', () => {
            for (let i = 0; i < 5; i++) {
                const randomPhrase = frasesAmor[Math.floor(Math.random() * frasesAmor.length)];
                createFloatingHeart(randomPhrase, i);
            }
            spawnBtn.textContent = "¡Magia activada! ✨";
            setTimeout(() => {
                spawnBtn.textContent = "Hacer latir más la magia";
            }, 2000);
        });

        // Inicialización general al cargar la ventana
        window.addEventListener('load', () => {
            createStars();
            
            // Generar la tanda inicial de corazones de manera escalonada
            frasesAmor.forEach((phrase, index) => {
                setTimeout(() => {
                    createFloatingHeart(phrase, index);
                }, index * 1200);
            });
        });
    </script>
</body>
  </html>
